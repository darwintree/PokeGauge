name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git submodule update --init --checkout --depth=1 PokeAPI/pokeapi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # Offline build: skips the networked usage compile, which only the deploy
      # path needs. Keeps PR checks independent of upstream Champions uptime.
      - run: pnpm build:offline
