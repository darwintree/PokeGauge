name: Deploy

# Usage artifacts are compiled at deploy time rather than committed: the ranking
# and the per-Pokemon rows change daily, so keeping them in git would grow the
# repository without bound. A daily redeploy refreshes them; the manual trigger
# exists so a fix can ship without waiting for the schedule.
on:
  schedule:
    # 18:17 UTC daily. Off the hour so it does not pile onto other cron traffic.
    - cron: "17 18 * * *"
  workflow_dispatch:

# Never let a scheduled refresh and a manual deploy race: two concurrent
# `wrangler deploy` runs would publish whichever finishes last.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git submodule update --init --checkout --depth=1 PokeAPI/pokeapi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Reads live upstream data, so this step fails rather than deploying without
      # artifacts: the client would otherwise silently fall back to proxy mode.
      # Compile after `build` because vite empties dist/ during the build.
      - run: pnpm usage:compile
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # An empty CLOUDFLARE_ACCOUNT_ID is worse than an unset one: wrangler
        # rejects it instead of inferring the account from the token, so drop it
        # when the secret is not configured.
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          pnpm exec wrangler deploy
