<!doctype html>
<!--
  PROTOTYPE · 箱线图替代方案探索（throwaway, mock 数据，非真实计算）
  Question: 用什么替代箱线图展示伤害范围 + 暴击伤害，且窄区间仍可读？
  Variants (?variant=): cur=现状箱线图 · A=期望条+暴击细线(初步方案) · B=分层范围条 · C=点+茎 · D=16次随机数刻度
  Run: 直接双击打开本文件，或 `open src/features/scenario-explorer/results/damage-range-bar.prototype.html`
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 伤害范围展示（箱线图替代）</title>
<style>
  :root {
    /* damage domain tokens - verbatim from src/styles/domain.css */
    --damage-safe-start: #c6e35a;   --damage-safe-end: #5f9f2c;
    --damage-cool-start: #ffd98a;   --damage-cool-end: #f5b73f;
    --damage-warm-start: #ffb066;   --damage-warm-end: #f58023;
    --damage-lethal-start: #ff7a6e; --damage-lethal-end: #e0352f;
    --damage-guaranteed-start: #c42b28; --damage-guaranteed-end: #7a1210;
    --damage-critical: #8b5cf6;
    /* hud chrome - from src/styles/hud.css */
    --ink: #1f2430; --paper: #ffffff; --bg-app: #e8ecfa;
    --hud-muted: #606776; --hairline: #e3e6f2; --card-border: #c9cede;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Baloo 2 Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg-app); color: var(--ink);
    font-variant-numeric: tabular-nums;
    padding: 24px 16px 96px;
  }
  #stage { max-width: 1080px; margin: 0 auto; transition: max-width .2s; }
  #stage.narrow { max-width: 430px; }

  header.page { margin-bottom: 14px; }
  header.page h1 { font-size: 17px; font-weight: 800; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge-proto {
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
    background: #ffd23f; border: 1px solid var(--ink); border-radius: 999px; padding: 2px 8px;
  }
  header.page p { font-size: 11.5px; color: var(--hud-muted); margin-top: 4px; max-width: 72ch; }

  .board {
    background: var(--paper); border: 1px solid var(--card-border); border-radius: 14px;
    box-shadow: 3px 3px 0 0 color-mix(in srgb, var(--ink) 16%, transparent);
    overflow: hidden;
  }
  #vdesc {
    padding: 8px 14px; font-size: 11.5px; font-weight: 700; color: var(--ink);
    background: #fff8e0; border-bottom: 1px solid var(--hairline);
  }
  #vdesc b { color: var(--hud-muted); margin-right: 6px; }

  /* ---- grid shared by axis + rows (desktop mirrors DESKTOP_RESULT_GRID) ---- */
  .axis, .row { display: grid; grid-template-columns: 14.75rem minmax(0,1fr) 9rem; gap: 0 12px; align-items: center; }
  #stage.narrow .axis, #stage.narrow .row { grid-template-columns: minmax(0,1fr) 3rem; gap: 0 8px; }
  #stage.narrow .axis-spacer { display: none; }
  #stage.narrow .meta { grid-column: 1 / -1; margin-bottom: 2px; }

  .axis {
    position: sticky; top: 0; z-index: 5; background: var(--paper);
    border-bottom: 1px solid var(--hairline); padding: 4px 14px 2px;
  }
  .axis-track { position: relative; height: 22px; }
  .axis-tick { position: absolute; top: 0; display: flex; flex-direction: column; align-items: center; }
  .axis-tick i { width: 1px; height: 9px; background: var(--hud-muted); }
  .axis-tick span { font-size: 9px; color: var(--hud-muted); margin-top: 1px; }
  .ko-head { font-size: 11px; font-weight: 800; color: var(--hud-muted); display: grid; grid-template-columns: 1fr 1fr; text-align: center; }
  #stage.narrow .ko-head { font-size: 8px; grid-template-columns: 1fr; text-align: right; gap: 2px; }

  .row { min-height: 64px; padding: 4px 14px; border-top: 1px solid var(--hairline); }
  .row:first-of-type { border-top: 0; }
  .meta { min-width: 0; font-size: 11px; line-height: 1.5; }
  .meta .l1 { font-weight: 800; }
  .meta .l2 { color: var(--hud-muted); font-weight: 700; }
  .meta .note {
    display: inline-block; font-size: 9px; font-weight: 800; color: var(--hud-muted);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 0 6px; margin-left: 4px;
  }

  .track { position: relative; height: 50px; min-width: 0; }
  .cy { top: 19px; } /* visual center line for all glyphs */
  .baseline { position: absolute; top: 19px; left: 0; right: 0; height: 1px; background: var(--hairline); }
  .ko { display: grid; grid-template-columns: 1fr 1fr; text-align: center; font-size: 12px; font-weight: 800; }
  #stage.narrow .ko { grid-template-columns: 1fr; font-size: 9px; gap: 2px; text-align: right; }
  .ko .zero { color: var(--hud-muted); }

  .range-label {
    position: absolute; bottom: 3px; white-space: nowrap; overflow: visible;
    font-size: 9.5px; font-weight: 800; color: color-mix(in srgb, var(--ink) 75%, transparent);
  }

  /* tones - .damage-tone--* from src/styles/domain.css */
  .tone-safe       { background: linear-gradient(180deg, var(--damage-safe-start), var(--damage-safe-end)); }
  .tone-cool       { background: linear-gradient(180deg, var(--damage-cool-start), var(--damage-cool-end)); }
  .tone-warm       { background: linear-gradient(180deg, var(--damage-warm-start), var(--damage-warm-end)); }
  .tone-lethal     { background: linear-gradient(180deg, var(--damage-lethal-start), var(--damage-lethal-end)); }
  .tone-guaranteed { background: linear-gradient(180deg, var(--damage-guaranteed-start), var(--damage-guaranteed-end)); }
  .tone-envelope   { background: linear-gradient(90deg, var(--damage-tone-left), var(--damage-tone-right)); }
  .a-safe       { background: color-mix(in srgb, var(--damage-safe-end) 45%, transparent); }
  .a-cool       { background: color-mix(in srgb, var(--damage-cool-end) 45%, transparent); }
  .a-warm       { background: color-mix(in srgb, var(--damage-warm-end) 45%, transparent); }
  .a-lethal     { background: color-mix(in srgb, var(--damage-lethal-end) 45%, transparent); }
  .a-guaranteed { background: color-mix(in srgb, var(--damage-guaranteed-end) 45%, transparent); }
  .a-env { background: linear-gradient(90deg,
    color-mix(in srgb, var(--damage-tone-left) 45%, transparent),
    color-mix(in srgb, var(--damage-tone-right) 45%, transparent)); }

  /* shared glyphs */
  .box { /* current box plot + variant A/B solid bars */
    position: absolute; height: 20px; border: 1px solid var(--ink); border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }
  .bridge { position: absolute; height: 0; border-top: 1px dashed color-mix(in srgb, var(--ink) 25%, transparent); }
  .crit-line { position: absolute; height: 2px; background: var(--damage-critical); }
  .crit-dot { /* ringed paper dot - current whisker endpoints */
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    border: 2px solid var(--damage-critical); background: var(--paper);
    transform: translate(-50%, -50%);
  }
  .crit-dot-fill { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--damage-critical); transform: translate(-50%, -50%); }
  .crit-cap { position: absolute; width: 2px; height: 12px; background: var(--damage-critical); border-radius: 1px; transform: translate(-50%, -50%); }
  .crit-band { position: absolute; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--damage-critical) 30%, transparent); transform: translateY(-50%); }

  /* variant C glyphs */
  .stem { position: absolute; height: 3px; border-radius: 2px; transform: translateY(-50%); }
  .dot-exp {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--paper);
    transform: translate(-50%, -50%);
  }
  .notch { position: absolute; width: 2px; height: 9px; background: color-mix(in srgb, var(--ink) 55%, transparent); transform: translate(-50%, -50%); border-radius: 1px; }

  /* variant D glyphs */
  .roll-tick { position: absolute; width: 2px; height: 16px; border-radius: 1px; transform: translate(-50%, -50%); }
  .diamond {
    position: absolute; width: 9px; height: 9px; border: 1.5px solid var(--ink);
    transform: translate(-50%, -50%) rotate(45deg); border-radius: 1px;
  }

  /* legend */
  .legend {
    display: flex; flex-wrap: wrap; gap: 14px; border-top: 1px solid var(--hairline);
    padding: 10px 14px; font-size: 10.5px; font-weight: 800; color: var(--hud-muted);
  }
  .legend .sw { display: inline-flex; overflow: hidden; border-radius: 999px; border: 1px solid var(--ink); vertical-align: -2px; margin-right: 6px; }
  .legend .sw i { width: 14px; height: 12px; }
  .legend .critsample { display: inline-flex; align-items: center; gap: 2px; margin-right: 6px; }
  .legend .critsample b { width: 16px; height: 2px; background: var(--damage-critical); }
  .legend .critsample i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--damage-critical); background: var(--paper); }

  details.data { margin-top: 12px; font-size: 11px; }
  details.data summary { cursor: pointer; font-weight: 800; color: var(--hud-muted); }
  details.data table { border-collapse: collapse; margin-top: 6px; width: 100%; background: var(--paper); }
  details.data th, details.data td { border: 1px solid var(--hairline); padding: 3px 8px; text-align: right; font-variant-numeric: tabular-nums; }
  details.data th:first-child, details.data td:first-child { text-align: left; }

  /* floating switcher */
  #switcher {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: var(--paper); border-radius: 999px; padding: 6px 10px;
    box-shadow: 0 6px 20px rgba(31,36,48,.35); font-size: 12px; font-weight: 800;
    max-width: calc(100vw - 24px); white-space: nowrap;
  }
  #switcher button {
    font: inherit; color: var(--paper); background: transparent; border: 0; cursor: pointer;
    padding: 2px 8px; border-radius: 999px;
  }
  #switcher button:hover { background: rgba(255,255,255,.15); }
  #switcher .sep { width: 1px; height: 16px; background: rgba(255,255,255,.25); }
  #switcher .vlabel { min-width: 15ch; text-align: center; }
  #switcher .count { color: rgba(255,255,255,.55); font-size: 10px; }
</style>

<body>
<div id="stage">
  <header class="page">
    <h1>伤害范围展示 · 箱线图替代方案 <span class="badge-proto">PROTOTYPE · THROWAWAY</span></h1>
    <p>Mock 数据，与真实计算无关。探索目标：替代现有箱线图（盒 = 普通范围，须 = 暴击范围），在区间很窄时仍能表达伤害语义。底部悬浮条或 ←/→ 键切换方案，URL 参数 <code>?variant=</code> 可分享。</p>
  </header>

  <div class="board">
    <div id="vdesc"></div>
    <div class="axis">
      <div class="axis-spacer" aria-hidden="true"></div>
      <div class="axis-track" id="axisTrack"></div>
      <div class="ko-head"><span>OHKO</span><span>≤2HKO</span></div>
    </div>
    <main id="rows"></main>
    <div class="legend">
      <span><span class="sw" id="legendSwatches"></span>普通伤害（颜色 = 当前分档逻辑）</span>
      <span><span class="critsample"><b></b><i></i></span>暴击伤害（至少一次暴击）</span>
    </div>
  </div>

  <details class="data">
    <summary>mock 数据（10 行 · 单位：HP 百分比）</summary>
    <div id="dataTable"></div>
  </details>
</div>

<nav id="switcher" aria-label="variant switcher">
  <button id="prev" title="上一个 (←)">‹</button>
  <span class="vlabel"><span id="vname"></span> <span class="count" id="vcount"></span></span>
  <button id="next" title="下一个 (→)">›</button>
  <span class="sep"></span>
  <button id="widthToggle" title="切换容器宽度（窄 = 模拟移动端）">宽度: 宽</button>
</nav>

<script>
"use strict";
/* ---- axis + tone logic: verbatim ports of damage-result-row.tsx / damage-tone.ts ---- */
const LINEAR_MAX = 100, AXIS_MAX = 200, LINEAR_FRACTION = 0.72, TICKS = [0, 25, 50, 75, 100, 200];
const clampPct = p => Math.min(Math.max(p, 0), AXIS_MAX);
const pctToFraction = p => {
  const c = clampPct(p);
  if (c <= LINEAR_MAX) return (c / LINEAR_MAX) * LINEAR_FRACTION;
  return LINEAR_FRACTION + Math.sqrt((c - LINEAR_MAX) / LINEAR_MAX) * (1 - LINEAR_FRACTION);
};
const L = p => (pctToFraction(p) * 100) + "%";
const W = (a, b) => ((pctToFraction(b) - pctToFraction(a)) * 100) + "%";
const span = (a, b) => `left:${L(a)};width:${W(a, b)};`;
const damageToneOf = (min, max) =>
  min >= 100 ? "guaranteed" : max >= 100 ? "lethal" : min >= 50 ? "warm" : max >= 43 ? "cool" : "safe";
const TONE_END = { safe: "#5f9f2c", cool: "#f5b73f", warm: "#f58023", lethal: "#e0352f", guaranteed: "#7a1210" };
const fmt = p => p.toFixed(1) + "%";

/* ---- mock rows: percent of defender HP ---- */
const ROWS = [
  { move: "撞击",        atk: "0A 木木枭",       def: "→ 252H 252B+ 幸福蛋",  min: 2.1,  max: 2.5,   critMin: 3.2,   critMax: 3.8,   ohko: "0%",        twoHit: "0%",   note: "极窄低伤" },
  { move: "真空波",      atk: "252A 路卡利欧",    def: "→ 4H 耿鬼",            min: 8.4,  max: 9.9,   critMin: 12.6,  critMax: 14.9,  ohko: "0%",        twoHit: "31.3%" },
  { move: "精神强念",    atk: "252C 沙奈朵",      def: "→ 252H 败露球菇",      min: 36.9, max: 43.5,  critMin: 55.4,  critMax: 65.3,  ohko: "0%",        twoHit: "100%" },
  { move: "地震",        atk: "252+ 土地云",      def: "→ 252H 土台龟",        min: 50.4, max: 59.3,  critMin: 75.6,  critMax: 89.0,  ohko: "0%",        twoHit: "100%" },
  { move: "真气弹·狙击", atk: "252C 路卡利欧",    def: "→ 0H 火焰鸡",          min: 30.1, max: 35.4,  critMin: 67.7,  critMax: 79.7,  ohko: "0%",        twoHit: "100%", note: "暴击差距大" },
  { move: "近身战",      atk: "252+ 武道熊师",    def: "→ 252H 多边兽2",       min: 88.0, max: 103.7, critMin: 132.0, critMax: 155.6, ohko: "31.3%",     twoHit: "100%", note: "跨100%" },
  { move: "伏特攻击",    atk: "252+ 皮卡丘",      def: "→ 0H 盖欧卡",          min: 102.3,max: 120.4, critMin: 153.5, critMax: 180.7, ohko: "100%",      twoHit: "100%", note: "确定1击" },
  { move: "蒸汽爆炸",    atk: "252C 波尔凯尼恩",  def: "→ 4H 坚果哑铃",        min: 60.2, max: 70.9,  critMin: 135.5, critMax: 159.5, ohko: "0%",        twoHit: "100%", note: "暴击深入压缩区" },
  { move: "地震",        atk: "0A-252A 土地云",   def: "→ 252H 土台龟",        min: 24.0, max: 118.0, critMin: 36.0,  critMax: 177.0, ohko: "0%-56.3%",  twoHit: "100%", note: "能力值范围",
    envelope: { low: { min: 24, max: 36 }, high: { min: 101, max: 118 } } },
  { move: "叶刃",        atk: "252+ 纸御剑",      def: "→ 4H 甲贺忍蛙",        min: 99.5, max: 100.4, critMin: 149.3, critMax: 150.7, ohko: "56.3%",     twoHit: "100%", note: "极窄跨100%" },
];
ROWS.forEach(r => { r.expected = r.envelope ? 71.0 : Math.round((r.min + r.max) / 2 * 10) / 10; });

/* ---- shared fragments ---- */
const el = (cls, style) => `<div class="${cls}" style="${style}"></div>`;
const toneCls = r => r.envelope ? "tone-envelope" : "tone-" + damageToneOf(r.min, r.max);
const envVars = r => {
  if (!r.envelope) return "";
  const lt = damageToneOf(r.envelope.low.min, r.envelope.low.max);
  const ht = damageToneOf(r.envelope.high.min, r.envelope.high.max);
  return `--damage-tone-left:var(--damage-${lt}-start);--damage-tone-right:var(--damage-${ht}-end);`;
};
const baseline = () => el("baseline", "");
const critWhisker = r => // current style: 2px line + ringed paper endpoint dots
  el("crit-line cy", span(r.critMin, r.critMax)) +
  el("crit-dot", `left:${L(r.critMin)};top:19px;`) +
  el("crit-dot", `left:${L(r.critMax)};top:19px;`);
const bridge = (a, b) => b > a ? el("bridge cy", span(a, b)) : "";

function hexLerp(h1, h2, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [a, b] = [p(h1), p(h2)];
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, "0")).join("");
}

/* ---- variant renderers (track inner HTML) ---- */
function renderCur(r) { // 现状箱线图
  return baseline() +
    el(`box cy ${toneCls(r)}`, span(r.min, r.max) + envVars(r) + "transform:translateY(-50%);") +
    bridge(r.max, r.critMin) + critWhisker(r);
}
function renderA(r) { // 期望条 + 暴击细线（初步方案）
  return baseline() +
    el(`box cy ${toneCls(r)}`, `left:0;width:${L(r.expected)};` + envVars(r) + "transform:translateY(-50%);") +
    el("crit-line cy", span(r.expected, r.critMax) + "transform:translateY(-50%);") +
    el("crit-cap", `left:${L(r.critMax)};top:19px;`);
}
function renderB(r) { // 分层范围条：实色保底 + 半透明浮动 + 暴击带
  const aCls = r.envelope ? "a-env" : "a-" + damageToneOf(r.min, r.max);
  return baseline() +
    el(`box cy ${toneCls(r)}`, `left:0;width:${L(r.min)};` + envVars(r) + "transform:translateY(-50%);") +
    el(`cy ${aCls}`, span(r.min, r.max) + envVars(r) +
      "height:20px;position:absolute;transform:translateY(-50%);border:1px dashed color-mix(in srgb,var(--ink) 40%,transparent);border-left:0;border-radius:0 3px 3px 0;") +
    bridge(r.max, r.critMin) +
    el("crit-band cy", span(r.critMin, r.critMax)) +
    el("crit-cap", `left:${L(r.critMax)};top:19px;`);
}
function renderC(r) { // 点 + 茎（lollipop）
  const tone = damageToneOf(r.min, r.max);
  const stemBg = r.envelope
    ? `background:linear-gradient(90deg,var(--damage-tone-left),var(--damage-tone-right));`
    : `background:${TONE_END[tone]};`;
  const dotBg = r.envelope ? `background:var(--damage-tone-right);` : `background:${TONE_END[tone]};`;
  return baseline() +
    el("stem cy", `left:0;width:${L(r.expected)};` + envVars(r) + stemBg) +
    el("notch", `left:${L(r.min)};top:19px;`) +
    el("notch", `left:${L(r.max)};top:19px;`) +
    el("crit-line cy", span(r.critMin, r.critMax) + "opacity:.75;transform:translateY(-50%);") +
    el("crit-dot", `left:${L(r.critMin)};top:19px;`) +
    el("crit-dot", `left:${L(r.critMax)};top:19px;`) +
    el("dot-exp", `left:${L(r.expected)};top:19px;` + dotBg);
}
function renderD(r) { // 16 次随机数刻度
  let ticks = "";
  const tone = damageToneOf(r.min, r.max);
  const lt = r.envelope ? damageToneOf(r.envelope.low.min, r.envelope.low.max) : tone;
  const ht = r.envelope ? damageToneOf(r.envelope.high.min, r.envelope.high.max) : tone;
  for (let i = 0; i < 16; i++) {
    const t = i / 15, pos = r.min + (r.max - r.min) * t;
    const color = r.envelope ? hexLerp(TONE_END[lt], TONE_END[ht], t) : TONE_END[tone];
    ticks += el("roll-tick", `left:${L(pos)};top:19px;background:${color};`);
  }
  const dia = r.envelope ? `background:var(--damage-tone-right);` : `background:${TONE_END[tone]};`;
  return baseline() + ticks +
    el("crit-line cy", span(r.critMin, r.critMax) + "transform:translateY(-50%);") +
    el("crit-dot-fill", `left:${L(r.critMin)};top:19px;`) +
    el("crit-dot-fill", `left:${L(r.critMax)};top:19px;`) +
    el("diamond", `left:${L(r.expected)};top:19px;` + dia);
}

const VARIANTS = [
  { k: "cur", name: "现状 · 箱线图", render: renderCur,
    desc: "对照组：盒 = 普通伤害范围 (min~max)，紫色须线 + 端点 = 暴击范围。窄区间时盒几乎不可见。" },
  { k: "A", name: "期望条 + 暴击细线", render: renderA,
    desc: "初步方案：条长 ∝ 期望伤害（16 次随机数均值，0 锚定），颜色沿用当前分档；紫色细线从条端延伸至暴击最大值。窄区间仍是完整色条。" },
  { k: "B", name: "分层范围条", render: renderB,
    desc: "0 锚定分段：实色 = 保底伤害 (0~min)，半透明虚框 = 随机数浮动 (min~max)，紫色带 + 端帽 = 暴击范围 (critMin~critMax)。保留全部范围语义。" },
  { k: "C", name: "点 + 茎 (lollipop)", render: renderC,
    desc: "最省墨水：茎 + 实心圆点 = 期望值，小缺口 = min/max 位置，紫色空心点 + 连线 = 暴击范围。" },
  { k: "D", name: "16 次随机数刻度", render: renderD,
    desc: "16 根刻度 = 16 次伤害判定（离散均匀分布），菱形 = 期望，紫色实心点 + 连线 = 暴击范围。显式展示分布形态。" },
];

/* ---- wiring ---- */
const params = new URLSearchParams(location.search);
let vi = Math.max(0, VARIANTS.findIndex(v => v.k === (params.get("variant") || "A")));
let narrow = params.get("width") === "narrow";

function renderAll() {
  const v = VARIANTS[vi];
  document.getElementById("vdesc").innerHTML = `<b>${v.k === "cur" ? "对照" : "方案 " + v.k}</b>${v.desc}`;
  document.getElementById("vname").textContent = v.k === "cur" ? "现状 · 箱线图" : `${v.k} · ${v.name}`;
  document.getElementById("vcount").textContent = `${vi + 1}/${VARIANTS.length}`;
  document.getElementById("widthToggle").textContent = narrow ? "宽度: 窄" : "宽度: 宽";
  document.getElementById("stage").classList.toggle("narrow", narrow);

  document.getElementById("rows").innerHTML = ROWS.map(r => `
    <div class="row">
      <div class="meta">
        <div class="l1">${r.move} · ${r.atk}${r.note ? `<span class="note">${r.note}</span>` : ""}</div>
        <div class="l2">${r.def}</div>
      </div>
      <div class="track" title="普通 ${fmt(r.min)} ~ ${fmt(r.max)} · 期望 ${fmt(r.expected)} · 暴击 ${fmt(r.critMin)} ~ ${fmt(r.critMax)}">
        ${v.render(r)}
        <div class="range-label" style="${span(r.min, r.max)}">${fmt(r.min)} ~ ${fmt(r.max)}</div>
      </div>
      <div class="ko">
        <span class="${r.ohko === "0%" ? "zero" : ""}">${r.ohko}</span>
        <span class="${r.twoHit === "0%" ? "zero" : ""}">${r.twoHit}</span>
      </div>
    </div>`).join("");

  const p = new URLSearchParams(location.search);
  p.set("variant", v.k);
  if (narrow) p.set("width", "narrow"); else p.delete("width");
  history.replaceState(null, "", "?" + p.toString());
}

function step(d) { vi = (vi + d + VARIANTS.length) % VARIANTS.length; renderAll(); }
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("widthToggle").onclick = () => { narrow = !narrow; renderAll(); };
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* axis ticks + legend swatches + data table (static, rendered once) */
document.getElementById("axisTrack").innerHTML = TICKS.map(t => {
  const x = t === 0 ? "none" : t === AXIS_MAX ? "translateX(-100%)" : "translateX(-50%)";
  return `<div class="axis-tick" style="left:${L(t)};transform:${x}"><i></i><span>${t}%</span></div>`;
}).join("") + el("", `position:absolute;top:0;bottom:0;left:${L(100)};border-left:1px dashed color-mix(in srgb,var(--ink) 35%,transparent);`);
document.getElementById("legendSwatches").innerHTML =
  ["safe", "cool", "warm", "lethal", "guaranteed"].map(t => `<i class="tone-${t}"></i>`).join("");
document.getElementById("dataTable").innerHTML = "<table><tr><th>行</th><th>min</th><th>max</th><th>期望</th><th>critMin</th><th>critMax</th><th>分档</th><th>OHKO</th><th>≤2HKO</th></tr>" +
  ROWS.map((r, i) => `<tr><td>${i + 1}. ${r.move} ${r.atk} ${r.def}${r.note ? "（" + r.note + "）" : ""}</td>` +
    `<td>${fmt(r.min)}</td><td>${fmt(r.max)}</td><td>${fmt(r.expected)}</td>` +
    `<td>${fmt(r.critMin)}</td><td>${fmt(r.critMax)}</td><td>${damageToneOf(r.min, r.max)}</td>` +
    `<td>${r.ohko}</td><td>${r.twoHit}</td></tr>`).join("") + "</table>";

renderAll();
</script>
</body>
</html>
